<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thiệp mời Hội Cầu Lông Rebellious Club</title>
<style>
:root{--red:#c8102e;--deep:#8f0a20;--cream:#fbf1dc;--kraft:#f2d9a8;--kraft2:#e6c78b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;
background-color:#d71a35;
background-image:linear-gradient(90deg,rgba(255,255,255,.35) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.35) 50%,transparent 50%);
background-size:64px 64px;}
.stage{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.env{position:relative;width:min(86vw,440px);aspect-ratio:10/7;cursor:pointer;transition:transform .9s cubic-bezier(.6,0,.3,1),opacity .6s;filter:drop-shadow(0 18px 24px rgba(80,0,10,.45));border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
.env:focus-visible{outline:4px solid #ffd54a;outline-offset:8px;border-radius:6px}
.back{position:absolute;inset:0;background:var(--kraft2);border-radius:6px;z-index:1}
.card{position:absolute;z-index:2;left:8%;width:84%;aspect-ratio:1;bottom:7%;transform:scale(.5);transform-origin:50% 100%;transition:transform .9s cubic-bezier(.3,.7,.2,1);border-radius:4px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.card img{width:100%;height:100%;display:block;border-radius:4px}
.pocket{position:absolute;inset:0;z-index:3;border-radius:6px;background:linear-gradient(160deg,var(--kraft),#e9cd92);clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%)}
.pocket::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.07),transparent 30%,transparent 70%,rgba(0,0,0,.07))}
.flap{position:absolute;left:0;top:0;width:100%;height:54%;z-index:4;background:linear-gradient(180deg,#f6e1b2,var(--kraft));clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .6s ease-in-out;border-radius:6px 6px 0 0}
.seal{position:absolute;z-index:5;left:50%;top:54%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ef3c55,var(--deep));display:grid;place-items:center;font-size:28px;box-shadow:0 3px 8px rgba(0,0,0,.4);transition:opacity .25s,transform .25s}
.hint{color:#fff;font-weight:600;font-size:17px;text-shadow:0 2px 6px rgba(90,0,10,.6);text-align:center;transition:opacity .4s;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-5px)}}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0;transform:scale(.5)}
.env.out .card{transform:translateY(-62%) scale(.5)}
.env.open~.hint{opacity:0;animation:none}
.env.away{transform:translateY(60vh);opacity:0;pointer-events:none}
.final{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;padding:16px}
.final img{width:min(94vw,92vh,720px);height:auto;aspect-ratio:1;border-radius:6px;box-shadow:0 20px 50px rgba(70,0,10,.55);opacity:0;transform:translateY(12vh) scale(.5) rotate(-3deg);transition:opacity .7s .1s,transform .9s cubic-bezier(.2,.8,.2,1)}
.final.on img{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation:none!important}}
</style></head><body>

  env.addEventListener('click',function(){
    if(busy)return;busy=true;
    env.classList.add('open');
    setTimeout(function(){env.classList.add('out')},550);
    setTimeout(function(){env.classList.add('away');fin.classList.add('on')},1700);
  });
})();
</script>
</body></html>
